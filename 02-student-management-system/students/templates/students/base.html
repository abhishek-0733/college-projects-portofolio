<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Student Management System
        {% endblock %}
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #212529;
        }

        .navbar {
            background-color: #1f2937;
            color: white;
            padding: 16px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .button {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        .primary {
            background-color: #0d6efd;
            color: white;
        }

        .success {
            background-color: #198754;
            color: white;
        }

        .danger {
            background-color: #dc3545;
            color: white;
        }

        .secondary {
            background-color: #6c757d;
            color: white;
        }

        .card {
            background-color: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);
        }

    </style>

    {% block extra_css %}
    {% endblock %}

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🎓 Student Management System
        </div>

        <div class="nav-links">

            <a href="{% url 'dashboard' %}">
                Dashboard
            </a>

            <a href="{% url 'student_list' %}">
                Students
            </a>

            <a href="{% url 'add_student' %}">
                Add Student
            </a>

        </div>

    </nav>


    <main class="container">

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
